project:
  type: website
  resources:
    - CNAME

website:
  title: "linear content"
  description: "thoughts on language, numeric computations, and other things."
  site-url: https://blog.mg3.dev
  open-graph: true
  twitter-card: true
  image: /images/site-preview.png
  navbar:
    background: light
    right:
      - text: "About"
        href: about.qmd
      - icon: github
        href: https://github.com/masta-g3
        aria-label: GitHub
      - icon: twitter-x
        href: https://x.com/masta_g3
        aria-label: X
  page-footer:
    left: |
      Linear Content
    center: |
      Built with [Quarto](https://quarto.org/)
    right: |
      [GitHub](https://github.com/masta-g3) · [X](https://x.com/masta_g3)

format:
  html:
    theme:
      light: [cosmo, _brand.yml]
      dark: [cosmo, _brand.yml, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    highlight-style:
      light: kate
      dark: zenburn
