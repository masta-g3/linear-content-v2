meta:
  name: Linear Content
  link: https://linearcontent.com

color:
  palette:
    white: "#FFFFFF"
    black: "#000000"
    dark-gray: "#1A1A1A"
    mid-gray: "#666666"
    light-gray: "#E5E5E5"
    border-gray: "#CCCCCC"
  foreground: black
  background: white
  primary: black
  secondary: mid-gray

typography:
  base:
    family: Berkeley Mono, ui-monospace, monospace
    size: 1rem
    line-height: 1.7
  headings:
    family: Berkeley Mono, ui-monospace, monospace
    weight: 700
    line-height: 1.3
  monospace:
    family: Berkeley Mono, ui-monospace, monospace
    size: 0.85em

defaults:
  bootstrap:
    link-color: black
    link-decoration: underline
